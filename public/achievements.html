<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Achievement</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#edf2f9] flex h-screen overflow-hidden text-slate-800">

  <aside class="w-64 bg-[#122247] text-slate-300 flex flex-col justify-between py-6 px-4 shrink-0 shadow-xl">
    <div class="space-y-6">
      <div class="flex items-center gap-3 px-3 py-2 text-white font-bold text-lg">
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <span>School Admin</span>
      </div>

      <nav class="space-y-1 text-sm font-medium">
        <a href="/dashboard.html" class="flex items-center gap-3 px-4 py-3 hover:bg-[#1a2d59] rounded-xl transition">
          <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
        </a>
        <a href="/students.html" class="flex items-center gap-3 px-4 py-3 hover:bg-[#1a2d59] rounded-xl transition">
          <i class="fa-solid fa-user-graduate w-5"></i> Students
        </a>
        <a href="/achievements.html" class="flex items-center gap-3 px-4 py-3 bg-[#20366b] text-white rounded-xl shadow-sm">
          <i class="fa-solid fa-award w-5"></i> Achievements
        </a>
      </nav>
    </div>
    <div class="px-3 border-t border-slate-700/60 pt-4">
      <a href="/index.html" class="flex items-center gap-2 text-sm text-red-400 hover:text-red-300 font-medium">
        <i class="fa-solid fa-right-from-bracket"></i> Log Out
      </a>
    </div>
  </aside>

  <main class="flex-1 overflow-y-auto p-6 md:p-8">
    <div class="max-w-6xl mx-auto bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-100 space-y-8">
      
      <!-- Header matching Slide 9 -->
      <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 border-b border-slate-100 pb-5">
        <div>
          <h1 class="text-2xl font-extrabold text-[#111c38]">Student Achievement</h1>
          <div class="flex items-center gap-4 text-xs font-semibold text-slate-500 mt-1">
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded bg-[#1e293b]"></span> Total Students: 1,250</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded bg-[#0d9488]"></span> Avg. Attendance: 94%</span>
          </div>
        </div>
        <select class="border border-slate-200 rounded-xl px-4 py-2 text-xs font-medium text-slate-600 bg-slate-50 focus:outline-none">
          <option>Last 6 Months</option>
        </select>
      </div>

      <!-- Top Row Charts -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2">
          <h2 class="text-sm font-bold text-slate-700 mb-4">Average Subject Scores</h2>
          <div class="h-60">
            <canvas id="scoresBarChart"></canvas>
          </div>
        </div>

        <div class="flex flex-col items-center justify-center p-6 bg-slate-50/70 rounded-2xl border border-slate-100">
          <h2 class="text-sm font-bold text-slate-700 mb-4">Overall Pass Rate</h2>
          <div class="relative w-44 h-44 flex items-center justify-center">
            <canvas id="passRateChart"></canvas>
            <div class="absolute text-center">
              <span class="text-3xl font-extrabold text-slate-800">87%</span>
              <p class="text-[11px] text-slate-400 font-medium">Pass Rate</p>
            </div>
          </div>
          <div class="flex gap-4 text-[11px] font-semibold mt-4">
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#0d9488]"></span> Passed</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#1e293b]"></span> Failed</span>
          </div>
        </div>
      </div>

      <!-- Performance Trends Chart -->
      <div class="pt-6 border-t border-slate-100">
        <h2 class="text-sm font-bold text-slate-700 mb-4">Performance Trends</h2>
        <div class="h-52">
          <canvas id="trendsLineChart"></canvas>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Subject Scores Bar Chart (Math:85, Science:78, English:92, History:88, Art:95)
    new Chart(document.getElementById('scoresBarChart'), {
      type: 'bar',
      data: {
        labels: ['Math', 'Science', 'English', 'History', 'Art'],
        datasets: [
          { label: 'Boys', data: [85, 78, 92, 88, 95], backgroundColor: '#1e293b', borderRadius: 6 },
          { label: 'Girls', data: [85, 78, 92, 88, 95], backgroundColor: '#0d9488', borderRadius: 6 }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { max: 100 } } }
    });

    // 87% Doughnut Pass Rate
    new Chart(document.getElementById('passRateChart'), {
      type: 'doughnut',
      data: {
        datasets: [{
          data: [87, 13],
          backgroundColor: ['#0d9488', '#1e293b'],
          borderWidth: 0
        }]
      },
      options: { cutout: '80%', plugins: { tooltip: { enabled: false } } }
    });

    // Trends Chart
    new Chart(document.getElementById('trendsLineChart'), {
      type: 'line',
      data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
        datasets: [
          { label: 'Boys', data: [72, 85, 82, 90, 95, 97], borderColor: '#0d9488', tension: 0.35 },
          { label: 'Girls', data: [80, 74, 85, 78, 87, 91], borderColor: '#1e293b', tension: 0.35 }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });
  </script>
</body>
</html>
