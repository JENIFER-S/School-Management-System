<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Students Record Management System - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">
  <div class="bg-white rounded-2xl shadow-xl flex flex-col md:flex-row max-w-4xl w-full overflow-hidden">
    <!-- Left Hero Banner -->
    <div class="md:w-1/2 bg-[#004e7c] p-8 text-white flex flex-col justify-center items-center text-center relative bg-cover bg-center" 
         style="background-image: linear-gradient(rgba(0,50,85,0.75), rgba(0,50,85,0.85)), url('https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=600&q=80');">
      <h2 class="text-3xl font-bold mb-2">Students Record Management System</h2>
      <p class="text-sm italic opacity-90">It's never too late to study</p>
    </div>

    <!-- Right Login Form -->
    <div class="md:w-1/2 p-8 md:p-12 flex flex-col justify-center">
      <div class="text-center mb-6">
        <div class="w-12 h-12 bg-blue-900 mx-auto rounded-full flex items-center justify-center text-amber-400 font-bold text-2xl mb-2">🎓</div>
        <h3 class="text-2xl font-bold text-slate-800">Welcome Back</h3>
        <p class="text-sm text-slate-500">Login to continue</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <select id="userRole" class="w-full border rounded-lg p-2.5 text-sm bg-slate-50 border-slate-300">
            <option value="Admin">Admin</option>
            <option value="Teacher">Teacher</option>
            <option value="Student">Student</option>
          </select>
        </div>
        <div>
          <input type="email" id="email" value="admin@school.com" required placeholder="Email" class="w-full border rounded-lg p-2.5 text-sm border-slate-300">
        </div>
        <div>
          <input type="password" id="password" value="admin123" required placeholder="Password" class="w-full border rounded-lg p-2.5 text-sm border-slate-300">
        </div>
        <div class="flex items-center text-sm text-slate-600">
          <input type="checkbox" id="togglePassword" class="mr-2 rounded">
          <label for="togglePassword">Show password</label>
        </div>
        <button type="submit" class="w-full bg-[#1e2a5e] text-white py-2.5 rounded-lg hover:bg-opacity-95 font-medium transition">Login</button>
      </form>
      <p class="text-xs text-center text-slate-400 mt-6">By logging in, you agree to our <a href="#" class="text-blue-600 underline">privacy statement</a>.</p>
    </div>
  </div>

  <script>
    document.getElementById('togglePassword').addEventListener('change', (e) => {
      document.getElementById('password').type = e.target.checked ? 'text' : 'password';
    });
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          role: document.getElementById('userRole').value
        })
      });
      const data = await res.json();
      if(data.success) {
        window.location.href = '/dashboard.html';
      } else {
        alert(data.message || 'Login failed');
      }
    });
  </script>
</body>
</html>
