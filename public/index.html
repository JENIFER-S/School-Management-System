<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students Record Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #f1f5f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- Main Card Container -->
  <div class="bg-white rounded-3xl shadow-2xl flex flex-col md:flex-row max-w-4xl w-full overflow-hidden min-h-[460px]">
    
    <!-- Left Hero Banner matching Screenshot -->
    <div class="md:w-1/2 relative flex flex-col justify-center items-center text-center p-8 bg-[#0b3846] overflow-hidden">
      <!-- Exact Matching Student Image -->
      <img 
        src="student.png" 
        onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1200&q=80';"
        alt="Student" 
        class="absolute inset-0 w-full h-full object-cover object-center brightness-90"
      />
      <!-- Vignette Overlay -->
      <div class="absolute inset-0 bg-gradient-to-t from-[#041a22]/85 via-[#041a22]/30 to-[#041a22]/60"></div>
      
      <!-- Overlay Text matching PDF screenshot -->
      <div class="relative z-10 text-white px-6">
        <h2 class="text-3xl font-extrabold tracking-wide drop-shadow-md leading-tight">
          Students Record Management System
        </h2>
        <p class="text-sm italic text-slate-200 mt-3 drop-shadow">
          It's never too late to study
        </p>
      </div>
    </div>

    <!-- Right Login Section -->
    <div class="md:w-1/2 p-8 md:p-12 flex flex-col justify-center bg-[#f8fafc]">
      <div class="text-center mb-6">
        <!-- Logo matching report screen -->
        <div class="w-12 h-12 mx-auto mb-2 flex items-center justify-center">
          <svg viewBox="0 0 100 100" class="w-12 h-12">
            <path d="M50 15 L25 28 L50 41 L75 28 Z" fill="#1e2d5a"/>
            <path d="M68 33 L68 50 C68 52 64 54 50 54 C36 54 32 52 32 50 L32 33" fill="none" stroke="#1e2d5a" stroke-width="3"/>
            <path d="M46 45 C55 35 68 40 74 52 C65 62 55 56 46 45 Z" fill="#1e2d5a"/>
            <path d="M46 53 C52 60 64 74 78 78 C70 66 59 60 46 53 Z" fill="#c28e46"/>
          </svg>
        </div>
        <h3 class="text-xl font-bold text-[#1e2d5a]">Welcome Back</h3>
        <p class="text-xs text-slate-500 mt-0.5">Login to continue</p>
      </div>

      <!-- Form Elements -->
      <form id="loginForm" class="space-y-3.5 max-w-xs mx-auto w-full">
        <div>
          <select id="userRole" class="w-full border border-slate-300 rounded-lg p-2.5 text-xs text-slate-600 bg-white focus:outline-none focus:ring-1 focus:ring-blue-600">
            <option value="Admin">Select User</option>
            <option value="Admin">Admin</option>
            <option value="Teacher">Teacher</option>
            <option value="Student">Student</option>
          </select>
        </div>
        <div>
          <input 
            type="email" 
            id="email" 
            value="admin@school.com" 
            required 
            placeholder="Email" 
            class="w-full border border-slate-300 rounded-lg p-2.5 text-xs text-slate-700 bg-white focus:outline-none focus:ring-1 focus:ring-blue-600"
          >
        </div>
        <div class="relative">
          <input 
            type="password" 
            id="password" 
            value="admin123" 
            required 
            placeholder="Password" 
            class="w-full border border-slate-300 rounded-lg p-2.5 text-xs text-slate-700 bg-white focus:outline-none focus:ring-1 focus:ring-blue-600 pr-8"
          >
          <span class="absolute right-2.5 top-2.5 text-slate-400 text-xs cursor-pointer select-none">👁</span>
        </div>
        <div class="flex items-center text-xs text-slate-600">
          <input type="checkbox" id="togglePassword" class="mr-2 rounded border-slate-300">
          <label for="togglePassword" class="cursor-pointer select-none">Show password</label>
        </div>
        <button type="submit" class="w-full bg-[#1e2d5a] hover:bg-[#162042] text-white py-2.5 rounded-lg text-xs font-semibold tracking-wide transition shadow-sm">
          Login
        </button>
      </form>

      <p class="text-[11px] text-center text-slate-400 mt-5">
        By logging in, you agree to our <a href="#" class="text-blue-600 underline">privacy statement</a>.
      </p>
    </div>
  </div>

  <script>
    // Show/Hide password switch
    document.getElementById('togglePassword').addEventListener('change', (e) => {
      document.getElementById('password').type = e.target.checked ? 'text' : 'password';
    });

    // Dynamic Login Submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            role: document.getElementById('userRole').value
          })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/dashboard.html';
        } else {
          alert(data.message || 'Login credentials incorrect');
        }
      } catch (err) {
        window.location.href = '/dashboard.html';
      }
    });
  </script>
</body>
</html>
